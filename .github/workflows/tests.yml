name: Tests and offline demonstration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m examples.generate_example_report
      - run: git diff --exit-code -- examples/example_report.md
      - run: python -m examples.run_llm_eval --output runs-ci